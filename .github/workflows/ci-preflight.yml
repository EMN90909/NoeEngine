name: Local preflight (Linux)
on:
  push:
    branches: [main]
    paths:
      - 'build.sh'
      - 'misc/build_products.py'
      - 'misc/ci_check.sh'
      - 'tests/python_build/test_noe_installer.py'
      - 'tests/python_build/test_noqeri_integration.py'
      - 'modules/noqeri/**'
      - 'tests/noqeri_scene/**'
      - 'NOTICE.md'
      - 'NOETHRIC-PROPRIETARY-LICENSE.txt'
      - 'version.py'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Packaging and script preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify shell and package contents
        run: bash misc/ci_check.sh
