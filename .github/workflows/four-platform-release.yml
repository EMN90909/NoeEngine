# Manually initiated because four native builds consume significant CI minutes.
# Only uploads real, verified files; never substitutes placeholder installers.
name: NoeEngine four-platform bundle

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noeengine-bundle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Run source checks and regression tests
        run: bash misc/ci_check.sh

  linux:
    needs: preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Debian-compatible Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends scons build-essential pkg-config dpkg-dev libx11-dev libxcursor-dev libxinerama-dev libxi-dev libxrandr-dev libxrender-dev libgl1-mesa-dev libudev-dev libasound2-dev libpulse-dev libfreetype6-dev libfontconfig1-dev libssl-dev libwayland-dev libxkbcommon-dev libvulkan-dev
      - name: Compile Linux editor and run native Noqeri tests
        run: python3 misc/build_products.py linux --jobs 2 --tests
      - name: Validate Linux files
        run: |
          test -s Products/NoeEngine-setup.deb
          test -s Products/NoeEngine-linux-x86_64.tar.gz
          dpkg-deb --info Products/NoeEngine-setup.deb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: output-linux
          path: |
            Products/NoeEngine-setup.deb
            Products/NoeEngine-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: preflight
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Set up NSIS and SCons
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          python -m pip install scons==4.8.1
      - name: Compile and package native Windows editor
        shell: pwsh
        run: python misc/build_products.py windows --jobs 2
      - name: Validate Windows setup
        shell: pwsh
        run: |
          if (-not (Test-Path "Products/NoeEngine-setup.exe" -PathType Leaf)) { throw "Missing Windows installer" }
          if ((Get-Item "Products/NoeEngine-setup.exe").Length -lt 100000) { throw "Windows installer is unexpectedly small" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: output-windows
          path: Products/NoeEngine-setup.exe
          if-no-files-found: error
          retention-days: 7

  macos:
    needs: preflight
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install macOS SCons and Vulkan tooling
        run: |
          python3 -m pip install scons==4.8.1
          brew list pkg-config >/dev/null 2>&1 || brew install pkg-config
          brew list jq >/dev/null 2>&1 || brew install jq
          bash misc/scripts/install_vulkan_sdk_macos.sh
      - name: Compile and package native macOS editor
        run: python3 misc/build_products.py macos --jobs 2
      - name: Validate macOS setup
        run: |
          test -s Products/NoeEngine-setup.pkg
          pkgutil --check-signature Products/NoeEngine-setup.pkg || echo "Unsigned development installer: expected"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: output-macos
          path: Products/NoeEngine-setup.pkg
          if-no-files-found: error
          retention-days: 7

  android:
    needs: preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SCons and matching Android SDK/NDK
        run: |
          python3 -m pip install scons==4.8.1
          test -n "${ANDROID_SDK_ROOT:-}"
          test -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "build-tools;33.0.2" "platforms;android-33" "ndk;23.2.8568313"
      - name: Compile Android editor and package real APK
        run: python3 misc/build_products.py android --jobs 2
      - name: Validate APK
        run: |
          test -s Products/NoeEngine-android-arm64.apk
          unzip -t Products/NoeEngine-android-arm64.apk > /dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: output-android
          path: Products/NoeEngine-android-arm64.apk
          if-no-files-found: error
          retention-days: 7

  bundle:
    needs: [linux, windows, macos, android]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: output-*
          path: incoming
      - name: Verify all four platforms and make one ZIP
        shell: python
        run: |
          from pathlib import Path
          from hashlib import sha256
          from zipfile import ZipFile, ZIP_STORED
          import os
          import shutil

          required = {
              "output-linux": ["NoeEngine-setup.deb", "NoeEngine-linux-x86_64.tar.gz"],
              "output-windows": ["NoeEngine-setup.exe"],
              "output-macos": ["NoeEngine-setup.pkg"],
              "output-android": ["NoeEngine-android-arm64.apk"],
          }
          root = Path("incoming")
          staging = Path("NoeEngine-four-platform-release")
          staging.mkdir(exist_ok=True)
          hashes = []
          for job, names in required.items():
              for name in names:
                  src = root / job / name
                  if not src.is_file() or src.stat().st_size < 100000:
                      raise SystemExit(f"Missing or invalid {job}/{name}: release bundle cancelled")
                  dst = staging / name
                  shutil.copyfile(src, dst)
                  hashes.append(f"{sha256(dst.read_bytes()).hexdigest()}  {name}")
          (staging / "SHA256SUMS.txt").write_text("\n".join(hashes) + "\n")
          (staging / "README.txt").write_text(
              "NoeEngine 0.1.0-dev. Unsigned test builds.\n"
              "Linux: use .deb (Debian) or unpack .tar.gz.\n"
              "Windows: run .exe; macOS: .pkg; Android: arm64 .apk.\n"
              "Artifacts are native builds; platform GUI and device compatibility\n"
              "still require installation tests.\n"
          )
          dest = Path("NoeEngine-all-platforms.zip")
          with ZipFile(dest, "w", compression=ZIP_STORED, allowZip64=True) as out:
              for src in staging.iterdir():
                  out.write(src, arcname=src.name)
          print(f"Bundle: {dest} ({dest.stat().st_size} bytes)")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NoeEngine-all-platforms
          path: NoeEngine-all-platforms.zip
          if-no-files-found: error
          retention-days: 7
