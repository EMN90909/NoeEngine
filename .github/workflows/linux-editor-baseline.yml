name: Linux editor baseline
on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'editor/**'
      - 'scene/**'
      - 'servers/**'
      - 'drivers/**'
      - 'modules/**'
      - 'platform/**'
      - 'thirdparty/**'
      - 'SConstruct'
      - 'version.py'
      - 'build.sh'
      - 'misc/build_products.py'
      - '.github/workflows/linux-editor-baseline.yml'
  pull_request:
    branches: [main]
    paths:
      - 'core/**'
      - 'editor/**'
      - 'scene/**'
      - 'servers/**'
      - 'drivers/**'
      - 'modules/**'
      - 'platform/**'
      - 'thirdparty/**'
      - 'SConstruct'
      - 'version.py'
      - 'build.sh'
      - 'misc/build_products.py'
      - '.github/workflows/linux-editor-baseline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editor:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config scons python3 libx11-dev libxcursor-dev libxinerama-dev libxi-dev libxrandr-dev libxrender-dev libgl1-mesa-dev libudev-dev libasound2-dev libpulse-dev libfreetype6-dev libfontconfig1-dev libssl-dev libwayland-dev libxkbcommon-dev libvulkan-dev
      - name: Build editor using SCons
        run: scons platform=linuxbsd target=editor module_mono_enabled=no module_noqeri_enabled=yes tests=yes debug_symbols=no -j2
      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          bins=(bin/godot.linuxbsd.editor.*)
          test "${#bins[@]}" -gt 0
          "${bins[0]}" --headless --version
          "${bins[0]}" --headless --help > /dev/null
          project="$(mktemp -d)"
          trap 'rm -rf "$project"' EXIT
          printf 'config_version=5\n' > "$project/project.godot"
          timeout 60 "${bins[0]}" --headless --editor --path "$project" --quit
      - name: Native Noqeri translator tests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          bins=(bin/godot.linuxbsd.editor.*)
          test "${#bins[@]}" -gt 0
          timeout 120 "${bins[0]}" --headless --test --test-case='[Noqeri]*'
      - name: Native Noqeri scene lifecycle smoke
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          bins=(bin/godot.linuxbsd.editor.*)
          test "${#bins[@]}" -gt 0
          output="$(timeout 90 "${bins[0]}" --headless --path tests/noqeri_scene 2>&1)"
          printf '%s\n' "$output"
          grep -q 'NOQERI_NATIVE_READY' <<< "$output"
          grep -q 'NOQERI_NATIVE_PROCESS' <<< "$output"
          test "$(grep -c 'NOQERI_REPEAT_STEP' <<< "$output")" -eq 2
