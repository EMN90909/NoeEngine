name: Linux editor baseline
on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'editor/**'
      - 'scene/**'
      - 'servers/**'
      - 'drivers/**'
      - 'modules/**'
      - 'platform/**'
      - 'thirdparty/**'
      - 'SConstruct'
      - 'version.py'
      - 'build.sh'
      - 'misc/build_products.py'
      - '.github/workflows/linux-editor-baseline.yml'
  pull_request:
    branches: [main]
    paths:
      - 'core/**'
      - 'editor/**'
      - 'scene/**'
      - 'servers/**'
      - 'drivers/**'
      - 'modules/**'
      - 'platform/**'
      - 'thirdparty/**'
      - 'SConstruct'
      - 'version.py'
      - 'build.sh'
      - 'misc/build_products.py'
      - '.github/workflows/linux-editor-baseline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editor:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config scons python3 libx11-dev libxcursor-dev libxinerama-dev libxi-dev libxrandr-dev libxrender-dev libgl1-mesa-dev libudev-dev libasound2-dev libpulse-dev libfreetype6-dev libfontconfig1-dev libssl-dev libwayland-dev libxkbcommon-dev libvulkan-dev
      - name: Compile NoeEngine with native Noqeri unit and scene tests
        run: ./build.sh linux 2 --tests
      - name: Inspect Debian setup package
        run: |
          dpkg-deb --info Products/NoeEngine-setup.deb
          test -s Products/NoeEngine-setup.deb
      - name: Upload qualifying Linux installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NoeEngine-Linux-installer
          path: Products/NoeEngine-setup.deb
          if-no-files-found: error
