name: NoeEngine repo migration (owner-triggered)
on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  migrate-main:
    if: >-
      ${{ github.repository == 'EMN90909/noe' &&
          github.event.issue.number == 2 &&
          github.event.comment.user.login == 'EMN90909' &&
          github.event.comment.body == '/run-noeengine-rebrand' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify migration source
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import ast,pathlib; ast.parse(pathlib.Path("tools/rebrand_to_noeengine.py").read_text())'
          python3 tools/rebrand_to_noeengine.py --dry-run > /tmp/noeengine-migration-plan.txt
          head -n 2 /tmp/noeengine-migration-plan.txt

      - name: Apply full text and tracked-path rebrand
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/rebrand_to_noeengine.py --apply
          python3 - <<'PY'
          import re, subprocess
          paths = [x.decode() for x in subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0") if x]
          remaining = [p for p in paths if re.search(r"godot", p, re.I)]
          assert not remaining, f"Old Godot paths remain: {remaining[:20]}"
          print(f"Verified {len(paths)} tracked paths; 0 Godot-named paths")
          PY
          git add -A
          git diff --cached --check

      - name: Commit migration to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "NoeEngine Migration"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No file changes."
          else
            git diff --cached --shortstat
            git commit -m "refactor: migrate Godot source and path references to NoeEngine [skip ci]"
            git push origin HEAD:main
          fi
