name: NoeRender policy tests
on:
  push:
    branches: [main]
    paths:
      - 'main/noe_render_quality*.h'
      - 'main/main.cpp'
      - 'scene/main/scene_tree.*'
      - 'tests/noe_render_*'
      - '.github/workflows/noe-render-policy.yml'
  pull_request:
    paths:
      - 'main/noe_render_quality*.h'
      - 'main/main.cpp'
      - 'scene/main/scene_tree.*'
      - 'tests/noe_render_*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile and run C++17 quality tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I. tests/noe_render_quality_policy_test.cpp -o /tmp/noe-render-test
          /tmp/noe-render-test
      - name: Run source integration tests
        run: |
          python3 tests/noe_render_integration_test.py
          python3 tests/noe_render_identity_test.py
